name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

# The suite is deliberately local-only: it must not need repository secrets,
# browser profiles, live wiki access, or external audio tools.
permissions:
  contents: read

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run Python in UTF-8 mode so the tagger's log glyphs (→, ✓, …) encode on
# Windows too (its default cp1252 console otherwise raises UnicodeEncodeError).
env:
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile source modules
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(path), doraise=True) for path in pathlib.Path('source').glob('*.py')]"

      - name: Run offline tests
        run: python -m unittest discover -s tests -v
